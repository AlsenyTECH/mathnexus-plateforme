# Configuration pour le déploiement sur Vercel.
# Vercel installe les dépendances listées ici (et non requirements.txt) : les deux listes doivent
# rester identiques (test_dependances_identiques). requirements.txt sert à Docker et au poste local.
[project]
name = "mathnexus-plateforme"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<5.2",
    "djangorestframework>=3.15,<4",
    "argon2-cffi>=23.1",
    "dj-database-url>=2.2",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.0",
    "gunicorn>=23",
]

[tool.vercel.scripts]
build = "python vercel_build.py"
