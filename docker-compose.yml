# Environnement complet en local : PostgreSQL, Redis et l'API.
#   cp .env.example .env   (puis remplir les valeurs)
#   docker compose up --build      → http://localhost:8080
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mathnexus
      POSTGRES_USER: mathnexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
    volumes:
      - donnees_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathnexus"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://mathnexus:${POSTGRES_PASSWORD}@db:5432/mathnexus
      REDIS_URL: redis://redis:6379/0
    volumes:
      - statiques:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build: ./frontend
    environment:
      DOMAINE: ${DOMAINE:-:80}
    ports:
      - "8080:80"
    volumes:
      - statiques:/statiques:ro
    depends_on:
      - api

volumes:
  donnees_pg:
  statiques:
