name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mathnexus
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mathnexus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mathnexus" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: python -m pytest
      - name: Contrôles de déploiement Django
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-uniquement-une-longue-valeur-aleatoire-0123456789abcdefghijklmnop
        run: python manage.py check --deploy --fail-level WARNING
